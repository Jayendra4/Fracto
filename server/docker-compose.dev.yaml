services:
  postgres:
    image: postgres:18
    container_name: hof-postgres
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
  pgadmin:
    image: dpage/pgadmin4
    container_name: hof-pgadmin
    restart: unless-stopped
    ports:
      - ${PGADMIN_PORT}:80
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin:/var/lib/pgadmin
  redis:
    image: redis/redis-stack
    container_name: hof-redis
    restart: unless-stopped
    ports:
      - ${REDIS_PORT}:6379
      - ${REDISINSIGHT_PORT}:8001
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD}
    volumes:
      - redis:/data
  mongo:
    image: mongo
    container_name: hof-mongo
    restart: unless-stopped
    ports:
      - ${MONGO_PORT}:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    command: --wiredTigerCacheSizeGB 0.25
    volumes:
      - mongo:/data/db
      - mongo-config:/data/configdb
  hof:
    image: hof-dev
    build:
      context: .
      target: hof-dev
      args:
        - PORT:${PORT}
    container_name: hof-dev
    restart: unless-stopped
    stop_grace_period: 600s
    ports:
      - ${PORT}:${PORT}
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/hof/
volumes:
  postgres:
    name: hof-postgres
  redis:
    name: hof-redis
  mongo:
    name: hof-mongo
  mongo-config:
    name: hof-mongo-config
  pgadmin:
    name: hof-pgadmin
networks:
  default:
    name: hof
