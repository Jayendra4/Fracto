services:
  postgres:
    image: postgres:18
    container_name: hof-postgres
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${POSTGRES_DATA_VOLUME}:/var/lib/postgresql
  redis:
    image: redis/redis-stack-server
    container_name: hof-redis
    restart: unless-stopped
    ports:
      - ${REDIS_PORT}:6379
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD}
    volumes:
      - ${REDIS_DATA_VOLUME}:/data
  mongo:
    image: mongo
    container_name: hof-mongo
    restart: unless-stopped
    ports:
      - ${MONGO_PORT}:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    command: --wiredTigerCacheSizeGB 0.25
    volumes:
      - ${MONGO_DATA_VOLUME}/db:/data/db
      - ${MONGO_DATA_VOLUME}/configdb:/data/configdb
  pgadmin:
    image: dpage/pgadmin4
    container_name: hof-pgadmin
    restart: unless-stopped
    ports:
      - ${PGADMIN_PORT}:80
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin:/var/lib/pgadmin
  hof:
    image: hof-${APP_ENV}-${NODE_TYPE}
    build:
      context: .
      target: hof
      args:
        - PORT:${PORT}
    container_name: hof-${APP_ENV}-${NODE_TYPE}
    restart: unless-stopped
    stop_grace_period: 600s
    ports:
      - ${PORT}:${PORT}
    # Uncomment this to disable run application on standalone mode
    # depends_on:
    #   - postgres
    #   - redis
    volumes:
      - .env:/hof/.env:ro
      - ${STORAGE_DATA_VOLUME}:/hof/${STORAGE_DIR}
volumes:
  pgadmin:
    name: hof-pgadmin
networks:
  default:
    name: hof
