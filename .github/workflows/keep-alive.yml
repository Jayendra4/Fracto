name: 24/7 Cloud Keep-Alive Cron

on:
  schedule:
    # Run every 10 minutes (UTC) to prevent Render / Cloud cold starts
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Cloud Backend
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping
        run: |
          if [ -n "${{ secrets.PROD_API_URL }}" ]; then
            echo "Pinging ${{ secrets.PROD_API_URL }}..."
            curl -s -f -m 30 "${{ secrets.PROD_API_URL }}/api" || echo "Ping dispatched"
          else
            echo "PROD_API_URL secret not set yet. Skipping ping."
          fi
